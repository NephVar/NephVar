}

}));

const emptyEl = document.getElementById("empty");

  const q   = document.getElementById("q").value.toLowerCase();

  const dom = document.getElementById("dom").value;

  let data = rows.filter(r =>

    (!dom || r.domain === dom)
  );

    const av = a[sortKey] ?? "", bv = b[sortKey] ?? "";

}

);
