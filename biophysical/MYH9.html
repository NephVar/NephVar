.count{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:auto}

th:hover{color:var(--ink)}
td{padding:9px 12px;border-top:1px solid var(--line)}

.mono{font-family:var(--mono);font-size:11.5px}
