function rect(attrs) {
  const e = document.createElementNS(ns, "rect");
  for (const [k,v] of Object.entries(attrs)) e.setAttribute(k,v);
  return e;
}
function text(attrs, label) {
  const e = document.createElementNS(ns, "text");

}

}
