  const e = document.createElementNS(ns, "rect");
  for (const [k,v] of Object.entries(attrs)) e.setAttribute(k,v);

}

  let data = rows.filter(r =>

    (!dom || r.domain === dom)
  );

  data.sort((a, b) => {
    const av = a[sortKey] ?? "", bv = b[sortKey] ?? "";

      <td class="mono">${r.aa || ""}</td>

}
